name: Android GDExtension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "imgui/**"
      - "addons/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "imgui/**"
      - "addons/**"
      - ".github/workflows/android.yml"

env:
  RUST_NIGHTLY: nightly-2026-06-19
  ANDROID_API: 24

jobs:
  build:
    name: Android (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-19
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install NDK (28.1.13356709)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/ndk"
          curl -fsSL https://dl.google.com/android/repository/android-ndk-r28b-linux.zip -o /tmp/android-ndk-r28b.zip
          unzip -q /tmp/android-ndk-r28b.zip -d /tmp/android-ndk-r28b
          mv /tmp/android-ndk-r28b/android-ndk-r28b "$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.1.13356709" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.1.13356709" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure Android target
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_ROOT"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"

          case "${{ matrix.arch }}" in
            arm64)
              target="aarch64-linux-android"
              target_env="AARCH64_LINUX_ANDROID"
              target_env_lower="aarch64_linux_android"
              ;;
            x86_64)
              target="x86_64-linux-android"
              target_env="X86_64_LINUX_ANDROID"
              target_env_lower="x86_64_linux_android"
              ;;
            *)
              echo "Unsupported Android architecture: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac

          linker="$bin/${target}${ANDROID_API}-clang"
          compiler="$bin/${target}${ANDROID_API}-clang++"
          test -x "$linker"
          test -x "$compiler"

          echo "RUST_TARGET=$target" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_env}_LINKER=$linker" >> "$GITHUB_ENV"
          echo "CC_${target_env_lower}=$linker" >> "$GITHUB_ENV"
          echo "CXX_${target_env_lower}=$compiler" >> "$GITHUB_ENV"
          echo "AR_${target_env_lower}=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_${target_env_lower}=$bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build debug and release
        working-directory: imgui
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_NIGHTLY" build --profile editor --target "$RUST_TARGET"
          cargo +"$RUST_NIGHTLY" build --release --target "$RUST_TARGET"

          output="../addons/dear-imgui-godot/target/android"
          mkdir -p "$output/debug/${{ matrix.arch }}" "$output/release/${{ matrix.arch }}"
          cp "../addons/dear-imgui-godot/target/$RUST_TARGET/editor/libdear_imgui_godot.so" \
            "$output/debug/${{ matrix.arch }}/libdear_imgui_godot.so"
          cp "../addons/dear-imgui-godot/target/$RUST_TARGET/release/libdear_imgui_godot.so" \
            "$output/release/${{ matrix.arch }}/libdear_imgui_godot.so"

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          file "addons/dear-imgui-godot/target/android/debug/${{ matrix.arch }}/libdear_imgui_godot.so"
          file "addons/dear-imgui-godot/target/android/release/${{ matrix.arch }}/libdear_imgui_godot.so"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dear-imgui-godot-android-${{ matrix.arch }}
          if-no-files-found: error
          path: addons/dear-imgui-godot/target/android
